<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SongHub</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin:0;
    background:#0b0b10;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}


header {
    padding:30px;
    text-align:center;
}


h1 {
    font-size:42px;
    margin:0 0 25px;
}


#search {

    width:min(900px,90%);
    padding:16px 20px;

    border-radius:14px;
    border:none;

    background:#191922;
    color:white;

    font-size:18px;

    outline:none;
}



#count {

    color:#999;
    margin-top:15px;

}



#results {

    width:min(950px,95%);
    margin:auto;

    padding-bottom:120px;

}



.card {

    background:#171720;

    border:1px solid #292936;

    border-radius:18px;

    padding:20px;

    margin:15px 0;

    transition:.2s;

}


.card:hover {

    transform:translateY(-3px);

    background:#1d1d29;

}



.title {

    font-size:22px;

    font-weight:bold;

}



.songname {

    color:#aaa;

    margin-top:8px;

}



.info {

    margin-top:15px;

    color:#ccc;

    font-size:14px;

    line-height:1.6;

}



button {

    margin-top:15px;

    margin-right:10px;

    padding:10px 15px;

    border-radius:10px;

    border:0;

    cursor:pointer;

    font-weight:bold;

}



.play {

    background:white;

    color:black;

}



.copy {

    background:#333;

    color:white;

}



audio {

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

}



</style>

</head>



<body>


<header>

<h1>🎧 SongHub</h1>


<input id="search"
placeholder="Buscar canción, artista, Newgrounds ID o SFH ID...">


<div id="count"></div>


</header>



<div id="results"></div>


<audio id="player" controls></audio>




<script>


let songs = [];


const results =
document.getElementById("results");


const search =
document.getElementById("search");


const count =
document.getElementById("count");


const player =
document.getElementById("player");



fetch("songs.json")

.then(r=>r.json())

.then(data=>{


    songs = data;


    console.log(
        "Canciones:",
        songs.length
    );


    render(
        songs.slice(0,50)
    );


});





function render(list){


    results.innerHTML="";


    count.textContent =
    list.length + " resultados";



    if(list.length===0){

        results.innerHTML =
        "<p>No encontrado</p>";

        return;

    }



    list.forEach(song=>{


        let card =
        document.createElement("div");


        card.className="card";


        let id = song._id;



        card.innerHTML = `


        <div class="title">

        🎵 ${escapeHTML(song.name || "Sin nombre")}

        </div>


        <div class="songname">

        ${escapeHTML(song.songName || "")}

        </div>


        <div class="info">


        🌐 Newgrounds:
        ${song.songID || "-"}

        <br>


        🔑 SFH:
        ${id}


        <br>


        📥 Descargas:
        ${song.downloads || 0}


        </div>



        <button class="play">

        ▶ Reproducir

        </button>



        <button class="copy">

        🔗 Copiar URL

        </button>


        `;



    card.querySelector(".play")
.onclick=async ()=>{

    player.pause();

   player.src = song.downloadUrl;

    try {

        await player.play();

    } catch(e) {

        console.log("Reproducción cancelada");

    }

};



        card.querySelector(".copy")
        .onclick=()=>{


            navigator.clipboard.writeText(

                "https://api.songfilehub.com/audio/"
                + id

            );


        };



        results.appendChild(card);



    });


}







search.oninput=()=>{


    let q =
    search.value
    .toLowerCase()
    .trim();



    if(!q){

        render(
            songs.slice(0,50)
        );

        return;

    }



    let filtered =
    songs.filter(song=>{


        let text = [

            song.name,

            song.songName,

            song.songID,

            song._id,

            song.songURL

        ]

        .join(" ")

        .toLowerCase();



        return text.includes(q);



    });



    render(
        filtered.slice(0,100)
    );

};





function escapeHTML(text){


    return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");


}


</script>

<footer>
    SongHub is an unofficial client using data and audio provided by Song File Hub.
    Not affiliated with Song File Hub.
</footer>


</body>
</html>
